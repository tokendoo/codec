[package]
name = "tokendoo-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WebAssembly (Node) bindings for the Tokendoo codec"
repository = "https://github.com/tokendoo/codec"
homepage = "https://tokendoo.com"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokendoo = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.wasm-pack.profile.release]
# Older Binaryen builds can cap the exported externref table, preventing Node
# initialization. Rust's release optimization remains enabled.
wasm-opt = false
