[package]
name = "tokendoo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Lossless structural JSON codec for Tokendoo"
repository = "https://github.com/tokendoo/codec"
homepage = "https://tokendoo.com"
readme = "../../README.md"
rust-version = "1.85"
keywords = ["json", "compression", "codec", "tokens", "lossless"]
categories = ["compression", "encoding"]
exclude = ["tests/estimator_calibration.rs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
sha2 = "0.11.0"
