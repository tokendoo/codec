[package]
name = "tokendoo-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Token-truth and comprehension measurement harnesses (dev-only; not shipped to Workers)"
publish = false

[lib]
name = "tokendoo_bench"
path = "src/lib.rs"

[[bin]]
name = "tokendoo-bench"
path = "src/main.rs"

[[bin]]
name = "tokendoo-eval"
path = "src/bin/eval.rs"

[[bin]]
name = "tokendoo-calibrate"
path = "src/bin/calibrate.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokendoo-core = { workspace = true }
tiktoken-rs = "0.12"
ureq = "3.3.0"
sha2 = "0.11.0"

[dev-dependencies]
serde_json = { workspace = true }
