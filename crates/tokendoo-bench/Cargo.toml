[package]
name = "tokendoo-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Token-truth measurement harness and alphabet derivation (dev-only)"
publish = false

[lib]
name = "tokendoo_bench"
path = "src/lib.rs"

[[bin]]
name = "tokendoo-bench"
path = "src/main.rs"

[[bin]]
name = "tokendoo-calibrate"
path = "src/bin/calibrate.rs"

[[bin]]
name = "tokendoo-derive-alphabet"
path = "src/bin/derive_alphabet.rs"

[[bin]]
name = "tokendoo-alphabets"
path = "src/bin/alphabets.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokendoo = { workspace = true }
tiktoken-rs = "0.12"
ureq = "3.3.0"
sha2 = "0.11.0"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex", "progressbar"] }

[dev-dependencies]
serde_json = { workspace = true }
