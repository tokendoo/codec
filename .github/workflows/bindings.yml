name: bindings

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-pack and wasm-opt
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          sudo apt-get update
          sudo apt-get install -y binaryen
      - name: Build npm package
        run: ./crates/tokendoo-wasm/build-npm.sh
      - name: Report WASM size
        run: |
          set -euo pipefail
          BYTES=$(wc -c < crates/tokendoo-wasm/pkg/tokendoo_wasm_bg.wasm)
          echo "tokendoo_wasm_bg.wasm bytes=${BYTES}"
      - name: Prove LICENSE and NOTICE in npm pack
        run: |
          set -euo pipefail
          cd crates/tokendoo-wasm/pkg
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          grep -q 'LICENSE' /tmp/npm-pack.txt
          grep -q 'NOTICE' /tmp/npm-pack.txt
      - name: Test packed tarball in clean install
        run: |
          set -euo pipefail
          cd crates/tokendoo-wasm/pkg
          TARBALL=$(npm pack)
          ABS_TARBALL="$PWD/$TARBALL"
          TMP=$(mktemp -d)
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$ABS_TARBALL"
          TOKENDOO_NPM="$TMP/node_modules/tokendoo" \
            node "${{ github.workspace }}/crates/tokendoo-wasm/tests/package.test.cjs"

  pypi-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: macos-latest
            target: universal2
            manylinux: ""
          - os: windows-latest
            target: x64
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release -m crates/tokendoo-py/Cargo.toml
      - name: Prove LICENSE and NOTICE in wheel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import os
          import zipfile

          wheels = sorted(glob.glob("target/wheels/tokendoo-*.whl"))
          assert wheels, "no wheel"
          names = zipfile.ZipFile(wheels[0]).namelist()
          print("\n".join(names))
          assert any(
              n == "LICENSE" or n.endswith("/LICENSE") or "licenses/LICENSE" in n
              for n in names
          ), names
          assert any("NOTICE" in n for n in names), names
          print("wheel_bytes", os.path.getsize(wheels[0]))
          PY
      - name: Test wheel in clean venv
        if: matrix.target != 'aarch64'
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls target/wheels/tokendoo-*.whl | head -n1)
          python -m venv .venv-wheel
          .venv-wheel/bin/pip install "$WHEEL"
          .venv-wheel/bin/python crates/tokendoo-py/tests/test_package.py

  cross-lang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          sudo apt-get update
          sudo apt-get install -y binaryen
          pip install maturin
      - name: Build artefacts
        run: |
          set -euo pipefail
          ./crates/tokendoo-wasm/build-npm.sh
          maturin build --release -m crates/tokendoo-py/Cargo.toml
          cargo build -p cross-lang --release
      - name: Install Python wheel
        run: |
          set -euo pipefail
          WHEEL=$(ls target/wheels/tokendoo-*.whl | head -n1)
          python -m venv .venv-cross
          .venv-cross/bin/pip install "$WHEEL"
      - name: Cross-language round-trip matrix
        run: |
          TOKENDOO_NPM="$PWD/crates/tokendoo-wasm/pkg" \
          TOKENDOO_PYTHON="$PWD/.venv-cross/bin/python" \
          CROSS_LANG_BIN="$PWD/target/release/cross-lang" \
            node scripts/cross-lang-roundtrip.cjs

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: test and clippy
        run: |
          cargo test --workspace
          cargo clippy --workspace -- -D warnings
