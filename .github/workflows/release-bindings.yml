name: release-bindings

# Builds npm and PyPI artefacts on version tags. Publication stays manual.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-pack and wasm-opt
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          sudo apt-get update
          sudo apt-get install -y binaryen
      - name: Build
        run: ./crates/tokendoo-wasm/build-npm.sh
      - name: Pack
        run: |
          set -euo pipefail
          cd crates/tokendoo-wasm/pkg
          npm pack
          npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tokendoo
          path: crates/tokendoo-wasm/pkg/tokendoo-*.tgz

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: macos-latest
            target: universal2
            manylinux: ""
          - os: windows-latest
            target: x64
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release -m crates/tokendoo-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: target/wheels/tokendoo-*.whl

  verify:
    runs-on: ubuntu-latest
    needs: [npm, wheels]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          sudo apt-get update
          sudo apt-get install -y binaryen
          pip install maturin
      - name: Build and verify locally
        run: |
          set -euo pipefail
          ./crates/tokendoo-wasm/build-npm.sh
          maturin build --release -m crates/tokendoo-py/Cargo.toml
          cargo build -p cross-lang --release
          python -m venv .venv-cross
          .venv-cross/bin/pip install "$(ls target/wheels/tokendoo-*.whl | head -n1)"
          TOKENDOO_NPM="$PWD/crates/tokendoo-wasm/pkg" \
          TOKENDOO_PYTHON="$PWD/.venv-cross/bin/python" \
          CROSS_LANG_BIN="$PWD/target/release/cross-lang" \
            node scripts/cross-lang-roundtrip.cjs
          cd crates/tokendoo-wasm/pkg
          TARBALL=$(npm pack)
          TMP=$(mktemp -d)
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$OLDPWD/$TARBALL"
          TOKENDOO_NPM="$TMP/node_modules/tokendoo" \
            node "${{ github.workspace }}/crates/tokendoo-wasm/tests/package.test.cjs"
          cd "${{ github.workspace }}"
          .venv-cross/bin/python crates/tokendoo-py/tests/test_package.py
