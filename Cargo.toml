[workspace]
resolver = "2"
members = [
    "crates/tokendoo",
    "crates/tokendoo-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Asynq"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
tokendoo = { path = "crates/tokendoo" }
